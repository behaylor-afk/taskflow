<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>TaskFlow</title>
<style>

/* ── Time Block Panel ── */
#tb-panel{position:fixed;bottom:1.5rem;right:1.5rem;width:280px;background:var(--color-surface);border:0.5px solid var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:500;display:none;flex-direction:column;max-height:80vh;user-select:none}
#tb-panel.open{display:flex}
#tb-header{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;background:var(--color-accent-mid);border-radius:var(--radius-lg) var(--radius-lg) 0 0;cursor:move;flex-shrink:0}
#tb-header-title{font-size:.75rem;font-weight:700;color:#fff;letter-spacing:.02em}
#tb-header-date{font-size:.62rem;color:rgba(255,255,255,.8)}
#tb-close{background:none;border:none;color:#fff;cursor:pointer;font-size:16px;line-height:1;padding:0;opacity:.8}
#tb-close:hover{opacity:1}
#tb-body{overflow-y:auto;flex:1}
.tb-slot{border-bottom:0.5px solid var(--color-border);min-height:52px}
.tb-slot.drag-over{background:var(--color-accent-bg)}
.tb-slot-label{font-size:.65rem;font-weight:600;color:var(--color-text-tertiary);padding:.28rem .6rem .15rem;letter-spacing:.04em;text-transform:uppercase;position:sticky;left:0}
.tb-slot-tasks{padding:0 .5rem .3rem}
.tb-task-chip{display:flex;align-items:center;gap:.3rem;padding:.25rem .4rem;margin-bottom:.2rem;background:var(--color-surface-2);border:0.5px solid var(--color-border);border-radius:var(--radius-sm);font-size:.72rem}
.tb-task-chip.critical{border-left:3px solid var(--color-coral)}
.tb-task-chip.done-chip{opacity:.5}
.tb-task-name{flex:1;color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-task-chip.done-chip .tb-task-name{text-decoration:line-through;color:var(--color-text-tertiary)}
.tb-chip-btn{background:none;border:none;cursor:pointer;padding:0;font-size:11px;color:var(--color-text-tertiary);line-height:1;flex-shrink:0}
.tb-chip-btn:hover{color:var(--color-text-primary)}
.tb-chip-chk{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--color-border-strong);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#fff;flex-shrink:0}
.tb-chip-chk.done{background:var(--color-accent-mid);border-color:var(--color-accent-mid)}
.tb-empty{font-size:.65rem;color:var(--color-text-tertiary);padding:.15rem .6rem .3rem;font-style:italic}
#tb-toggle{background:var(--color-accent-mid);color:#fff;border:none;border-radius:var(--radius-md);padding:.35rem .75rem;font-size:.75rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.35rem;flex-shrink:0}
.task-draggable{cursor:grab}
.task-draggable:active{cursor:grabbing}

/* ── Top Nav ── */
#top-nav{background:var(--color-surface);border-bottom:0.5px solid var(--color-border);display:flex;align-items:center;gap:0;padding:0 1.25rem;position:sticky;top:0;z-index:200}
.nav-logo{display:flex;align-items:center;gap:.5rem;padding:.6rem 0;margin-right:1rem;flex-shrink:0}
.nav-logo-icon{width:26px;height:26px;background:var(--color-accent-mid);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.nav-logo-name{font-size:.95rem;font-weight:600;color:var(--color-text-primary);letter-spacing:-.01em}
.nav-tabs{display:flex;flex:1;gap:0}
.nav-tab{padding:.65rem .875rem;font-size:.78rem;font-weight:500;color:var(--color-text-secondary);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-family:inherit}
.nav-tab:hover{color:var(--color-text-primary)}
.nav-tab.active{color:var(--color-accent-text);border-bottom-color:var(--color-accent-mid);font-weight:600}

/* ── Pages ── */
.page{display:none}
.page.active{display:block}

/* ── Birthday page ── */
#bday-page{padding:1rem 1.25rem 2rem;max-width:700px}
.bday-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.bday-title{font-size:.72rem;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.08em}
.bday-add-btn{background:var(--color-accent-mid);color:#fff;border:none;border-radius:var(--radius-md);padding:.35rem .85rem;font-size:.75rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:.3rem}
.bday-form{background:var(--color-surface);border:0.5px solid var(--color-border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;display:none}
.bday-form.open{display:block}
.bday-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.bday-form-full{grid-column:1/-1}
.bday-actions{display:flex;gap:.5rem;justify-content:flex-end}
.bday-table{width:100%;border-collapse:collapse;background:var(--color-surface);border:0.5px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden}
.bday-table th{padding:.45rem .75rem;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-tertiary);text-align:left;border-bottom:0.5px solid var(--color-border);background:var(--color-surface-2)}
.bday-table td{padding:.5rem .75rem;font-size:.8rem;border-bottom:0.5px solid var(--color-border);vertical-align:middle;color:var(--color-text-primary)}
.bday-table tr:last-child td{border-bottom:none}
.bday-table tbody tr:hover td{background:var(--color-accent-bg)}
.bday-upcoming{display:inline-block;font-size:.65rem;font-weight:600;padding:.1rem .35rem;border-radius:4px;background:var(--color-accent-bg);color:var(--color-accent-text);margin-left:.4rem}
.bday-today{background:var(--color-coral-bg);color:var(--color-coral-text)}
.appt-bday{background:rgba(239,159,39,.12) !important;border-color:rgba(186,117,23,.25) !important}
.appt-bday .appt-dot{background:var(--color-accent-mid) !important}
.appt-bday .appt-txt{color:var(--color-accent-text) !important;font-style:italic}

:root {
  --color-bg: #FAF9F7;
  --color-surface: #FFFFFF;
  --color-surface-2: #F5F3F0;
  --color-border: rgba(0,0,0,0.1);
  --color-border-strong: rgba(0,0,0,0.18);
  --color-text-primary: #1a1915;
  --color-text-secondary: #6b6860;
  --color-text-tertiary: #9c9a96;
  --color-accent: #BA7517;
  --color-accent-bg: #FAEEDA;
  --color-accent-mid: #EF9F27;
  --color-accent-text: #633806;
  --color-coral: #D85A30;
  --color-coral-bg: #FAECE7;
  --color-coral-text: #4A1B0C;
  --color-danger: #E24B4A;
  --color-danger-bg: #FCEBEB;
  --color-success: #1D9E75;
  --color-success-bg: #E1F5EE;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1a1915;
    --color-surface: #252420;
    --color-surface-2: #2e2c28;
    --color-border: rgba(255,255,255,0.1);
    --color-border-strong: rgba(255,255,255,0.18);
    --color-text-primary: #f0ede8;
    --color-text-secondary: #a8a49e;
    --color-text-tertiary: #6b6860;
    --color-accent: #FAC775;
    --color-accent-bg: #412402;
    --color-accent-mid: #EF9F27;
    --color-accent-text: #FAEEDA;
    --color-coral: #F0997B;
    --color-coral-bg: #4A1B0C;
    --color-coral-text: #FAECE7;
    --color-danger: #F09595;
    --color-danger-bg: #501313;
    --color-success: #5DCAA5;
    --color-success-bg: #04342C;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;font-family:var(--font);background:var(--color-bg);color:var(--color-text-primary);-webkit-tap-highlight-color:transparent}
input,select,button,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none}
button i{pointer-events:none}
input::placeholder{color:var(--color-text-tertiary)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(0)}
select option{background:var(--color-surface)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--color-border-strong);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Week strip ── */
#week-strip{background:var(--color-surface);border-bottom:0.5px solid var(--color-border);padding:1rem 1.25rem 1rem}
#week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.brand{display:flex;align-items:center;gap:.5rem}
.brand-icon{width:28px;height:28px;background:var(--color-accent-mid);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.brand-name{font-size:1rem;font-weight:500;color:var(--color-text-primary);letter-spacing:-.01em}
.wk-meta{text-align:right}
.wk-range{font-size:.75rem;color:var(--color-text-tertiary);font-family:var(--font-mono)}
#week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.375rem;height:clamp(160px,24vh,260px)}

/* ── Day column ── */
.day-col{display:flex;flex-direction:column;background:var(--color-surface-2);border:0.5px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;min-height:0}
.day-col.is-today{background:var(--color-accent-bg);border:1.5px solid var(--color-accent-mid)}
.day-hd{padding:.4rem .35rem .35rem;text-align:center;flex-shrink:0;border-bottom:0.5px solid var(--color-border)}
.day-col.is-today .day-hd{border-bottom-color:rgba(186,117,23,.25)}
.day-lbl{font-size:.58rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-tertiary)}
.day-col.is-today .day-lbl{color:var(--color-accent)}
.day-col.is-past .day-lbl{color:var(--color-text-tertiary);opacity:.5}
.day-num{width:22px;height:22px;margin:.15rem auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500;color:var(--color-text-secondary);font-family:var(--font-mono)}
.day-col.is-today .day-num{background:var(--color-accent-mid);color:#fff}
.day-col.is-past .day-num{opacity:.4}
.appt-list{flex:1;overflow-y:auto;padding:.3rem .3rem .2rem}
.appt-empty{font-size:.6rem;color:var(--color-text-tertiary);text-align:center;padding:.5rem 0;opacity:.5}
.appt-item{display:flex;align-items:flex-start;gap:.2rem;padding:.2rem .25rem;margin-bottom:.18rem;background:var(--color-surface);border-radius:var(--radius-sm);border:0.5px solid var(--color-border);cursor:grab;transition:opacity .15s,box-shadow .15s;user-select:none}
.appt-item.dragging{opacity:.35;cursor:grabbing}
.appt-item.drag-over-top{border-top:2px solid var(--color-accent-mid)}
.appt-item.drag-over-bottom{border-bottom:2px solid var(--color-accent-mid)}
.appt-drag-handle{font-size:9px;color:var(--color-text-tertiary);flex-shrink:0;margin-top:.25rem;cursor:grab;pointer-events:none;letter-spacing:1px}
.day-col.is-today .appt-item{background:rgba(239,159,39,.08);border-color:rgba(186,117,23,.2)}
.appt-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:.25rem;background:var(--color-text-tertiary)}
.day-col.is-today .appt-dot{background:var(--color-accent)}
.appt-txt{flex:1;font-size:.63rem;line-height:1.35;color:var(--color-text-primary);word-break:break-word}
.day-col.is-past .appt-txt{color:var(--color-text-tertiary)}
.appt-del{background:none;border:none;padding:0;opacity:.3;display:flex;align-items:center;flex-shrink:0;cursor:pointer;color:var(--color-text-secondary);font-size:11px}
.appt-del:hover{opacity:.7}
.appt-input-row{border-top:0.5px solid var(--color-border);padding:.25rem .3rem;flex-shrink:0;display:flex;gap:.18rem;align-items:center}
.day-col.is-today .appt-input-row{background:rgba(239,159,39,.04)}
.appt-inp{flex:1;background:transparent;border:none;color:var(--color-text-primary);font-size:.65rem;outline:none;padding:.1rem 0;min-width:0}
.appt-add{background:var(--color-accent-mid);border-radius:4px;width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;color:#fff;font-size:11px}

/* ── Controls ── */
#controls{background:var(--color-surface);border-bottom:0.5px solid var(--color-border);padding:.625rem 1.25rem;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
#ctrl-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.today-str{font-size:.72rem;color:var(--color-text-tertiary);font-weight:400}
.filter-btns{display:flex;gap:.25rem}
.fbtn{padding:.3rem .7rem;border-radius:var(--radius-md);font-size:.72rem;font-weight:400;border:0.5px solid var(--color-border-strong);color:var(--color-text-secondary);background:transparent;white-space:nowrap;cursor:pointer;transition:all .15s}
.fbtn:hover{background:var(--color-surface-2)}
.fbtn.active{background:var(--color-accent-bg);border-color:var(--color-accent-mid);color:var(--color-accent-text)}
.new-btn{background:var(--color-accent-mid);color:#fff;border-radius:var(--radius-md);padding:.35rem .85rem;font-size:.75rem;font-weight:500;display:flex;align-items:center;gap:.3rem;flex-shrink:0;cursor:pointer;border:none;transition:opacity .15s}
.new-btn:hover{opacity:.88}
.sync-row{font-size:.65rem;color:var(--color-text-tertiary);display:flex;align-items:center;gap:.3rem}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--color-success)}
.sync-dot.syncing{width:8px;height:8px;border:1.5px solid var(--color-accent-mid);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;background:transparent}
.sync-dot.error{background:var(--color-danger)}

/* ── Task area ── */
#task-area{padding:1rem 1.25rem 2rem}
.section{border-radius:var(--radius-lg);overflow:hidden;border:0.5px solid var(--color-border)}
.sec-head{padding:.5rem .875rem;border-bottom:0.5px solid var(--color-border)}
.sec-head-inner{display:grid;grid-template-columns:32px 1fr 130px 95px 100px 56px;gap:0}
.col-hd{padding:.4rem .6rem;font-size:.62rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-tertiary)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:.5rem .6rem;vertical-align:middle;border-bottom:0.5px solid var(--color-border);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s;background:var(--color-surface)}
tbody tr:nth-child(even){background:var(--color-surface-2)}
tbody tr:hover{background:var(--color-accent-bg);opacity:.95}
tbody tr.row-done{opacity:.5}
.td-chk{width:32px;text-align:center;padding-left:.5rem;padding-right:0}
.td-name{font-weight:400;color:var(--color-text-primary);white-space:normal}
.row-done .td-name{text-decoration:line-through;color:var(--color-text-tertiary)}
.td-ent{color:var(--color-text-secondary);width:130px;font-size:.75rem}
.td-start{color:var(--color-text-tertiary);width:95px;font-family:var(--font-mono);font-size:.72rem}
.td-due{width:100px}
.chip{display:inline-block;padding:.12rem .4rem;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.7rem;background:var(--color-surface-2);color:var(--color-text-secondary);border:0.5px solid var(--color-border)}
.chip-overdue{background:var(--color-coral-bg);color:var(--color-coral-text);border-color:rgba(216,90,48,.2)}
.chip-today{background:var(--color-accent-bg);color:var(--color-accent-text);border-color:rgba(186,117,23,.25)}
.chip-active{background:var(--color-accent-bg);color:var(--color-accent-text);border-color:rgba(186,117,23,.2)}
.td-act{width:80px;text-align:right;padding-right:.5rem}
.act-btns{display:flex;gap:.2rem;justify-content:flex-end}
.act-btn{background:transparent;border:0.5px solid var(--color-border);border-radius:var(--radius-sm);width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-tertiary);font-size:13px;transition:all .12s}
.act-btn:hover{background:var(--color-surface-2);border-color:var(--color-border-strong);color:var(--color-text-primary)}
.act-btn.del:hover{background:var(--color-danger-bg);border-color:rgba(226,75,74,.3);color:var(--color-danger)}
.rec-badge{display:inline-block;margin-left:.35rem;font-size:.58rem;font-weight:500;color:var(--color-accent-text);background:var(--color-accent-bg);padding:.08rem .3rem;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle;border:0.5px solid rgba(186,117,23,.2)}
.chkbox{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;cursor:pointer;border:1.5px solid var(--color-border-strong);background:transparent;font-size:10px;color:#fff}
.chkbox.checked{background:var(--color-accent-mid);border-color:var(--color-accent-mid)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--color-text-tertiary);animation:fadeUp .3s ease}
.no-api-banner{background:var(--color-accent-bg);border:0.5px solid rgba(186,117,23,.3);border-radius:var(--radius-md);padding:.75rem 1rem;margin-bottom:.875rem;font-size:.75rem;color:var(--color-accent-text);display:flex;align-items:flex-start;gap:.5rem}

/* ── Subtasks ── */
.subtask-row td{padding:.35rem .6rem .35rem 2.5rem;border-bottom:0.5px solid var(--color-border);font-size:.75rem;background:var(--color-surface)}
.subtask-row:nth-child(even) td{background:var(--color-surface-2)}
.subtask-row:hover td{background:var(--color-accent-bg)}
.subtask-row.row-done td{opacity:.5}
.subtask-row.row-done .td-name{text-decoration:line-through;color:var(--color-text-tertiary)}
.subtask-chk{width:16px;height:16px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;border:1.5px solid var(--color-border-strong);background:transparent;font-size:10px;color:#fff;padding:0;vertical-align:middle}
.subtask-row:hover .subtask-chk{border-color:var(--color-accent-mid)}
.subtask-chk.checked{background:var(--color-accent-mid);border-color:var(--color-accent-mid)}
.progress-badge{display:inline-block;margin-left:.4rem;font-size:.58rem;font-weight:500;color:var(--color-accent-text);background:var(--color-accent-bg);padding:.08rem .3rem;border-radius:4px;border:0.5px solid rgba(186,117,23,.2);vertical-align:middle}
.progress-badge.complete{background:var(--color-success-bg);color:#085041;border-color:rgba(29,158,117,.2)}
/* Subtask form inside modal */
.subtask-form-area{margin-top:.5rem}
.subtask-list-edit{display:grid;gap:.3rem;margin-bottom:.4rem}
.subtask-edit-item{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;background:var(--color-surface-2);border-radius:var(--radius-sm);border:0.5px solid var(--color-border)}
.subtask-edit-item span{flex:1;font-size:.78rem;color:var(--color-text-primary)}
.subtask-del-btn{background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);font-size:13px;padding:0;display:flex;align-items:center}
.subtask-del-btn:hover{color:var(--color-danger)}
.subtask-add-row{display:flex;gap:.4rem}
.subtask-add-inp{flex:1;background:var(--color-surface-2);border:0.5px solid var(--color-border-strong);border-radius:var(--radius-sm);color:var(--color-text-primary);padding:.35rem .55rem;font-size:.78rem;outline:none}
.subtask-add-inp:focus{border-color:var(--color-accent-mid)}
.subtask-add-btn{background:var(--color-accent-mid);color:#fff;border:none;border-radius:var(--radius-sm);padding:.35rem .65rem;font-size:.75rem;cursor:pointer;white-space:nowrap}

/* ── Search ── */
.search-wrap{position:relative;display:flex;align-items:center}
.search-inp{background:var(--color-surface-2);border:0.5px solid var(--color-border-strong);border-radius:var(--radius-md);color:var(--color-text-primary);padding:.32rem .65rem .32rem 1.9rem;font-size:.775rem;outline:none;width:180px;transition:border-color .15s,width .2s}
.search-inp:focus{border-color:var(--color-accent-mid);width:220px}
.search-inp::placeholder{color:var(--color-text-tertiary)}
.search-icon{position:absolute;left:.55rem;color:var(--color-text-tertiary);font-size:13px;pointer-events:none}

<script>

var API_URL = "https://script.google.com/macros/s/AKfycbzeBKpEgrt54OMUycio5ItJrdybAf5BfFQZtzWDzgjxD2HNnHmCnuYBn7_k__kdL_w/exec";
var NO_API  = !API_URL || API_URL === "YOUR_APPS_SCRIPT_URL_HERE";

var tasks        = [];
var appointments = {};
var completions  = {};
var curFilter    = "due";
var expandedTasks = {}; // taskId -> true/false
var searchQuery   = "";
var timeBlocks    = {}; // {"HH": ["taskId1","taskId2"]} resets daily
var tbDate        = "";  // date timeBlocks was last built for
var tbOpen        = false;
var tbDragTaskId  = null;
var notes         = []; // [{id, title, body, order}]
var birthdays     = []; // [{id, first, last, date:"MM-DD", note}]
var editingId    = null;

function todayStr() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}

function localDateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}

function getWeekDays() {
  var now = new Date();
  var day = now.getDay();
  var diff = (day === 0) ? -6 : 1 - day;
  var mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  var days = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
    days.push(localDateStr(d));
  }
  return days;
}

function addBizDays(dateStr, n) {
  var p=dateStr.split("-");
  var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  var added=0;
  while(added<n){ d.setDate(d.getDate()+1); var dow=d.getDay(); if(dow!==0&&dow!==6) added++; }
  return localDateStr(d);
}

function nextOccurrence(task, fromDate) {
  if(task.recurrence==="daily") return addBizDays(fromDate,1);
  var p=fromDate.split("-");
  var x=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  if(task.recurrence==="weekly")        x.setDate(x.getDate()+7);
  else if(task.recurrence==="biweekly") x.setDate(x.getDate()+14);
  else if(task.recurrence==="monthly")  x.setMonth(x.getMonth()+1);
  return localDateStr(x);
}

function isOverdue(task)   { return task.dueDate < todayStr(); }
function isDueToday(task)  { return task.dueDate === todayStr(); }
function isCompleted(id) {
  var task = tasks.find(function(t){return t.id===id;});
  if (!task) return false;
  return !!task.permanentlyDone;
}

function normalizeDate(val) {
  if(!val) return "";
  var s=String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){ var p=s.split("/"); return p[2]+"-"+p[0].padStart(2,"0")+"-"+p[1].padStart(2,"0"); }
  try{ var d=new Date(s); if(!isNaN(d)) return localDateStr(d); } catch(e){}
  return s;
}

function fmtDate(iso) {
  if(!iso) return "";
  var s=normalizeDate(iso), p=s.split("-");
  if(p.length!==3) return iso;
  return p[1]+"/"+p[2]+"/"+p[0];
}

function recLabel(r) { return {daily:"Daily",weekly:"Weekly",biweekly:"Bi-weekly",monthly:"Monthly",none:""}[r]||""; }

function sortTasks(arr) {
  return arr.slice().sort(function(a,b){
    if(a.dueDate<b.dueDate) return -1; if(a.dueDate>b.dueDate) return 1;
    return a.name.localeCompare(b.name);
  });
}

function makeUUID() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){ var r=Math.random()*16|0; return(c==="x"?r:(r&0x3|0x8)).toString(16); });
}

function setSync(state, msg) {
  var dot=document.getElementById("sync-dot"), lbl=document.getElementById("sync-lbl");
  if(!dot) return;
  dot.className="sync-dot"+(state==="syncing"?" syncing":state==="error"?" error":"");
  lbl.textContent=msg||(state==="syncing"?"Saving...":state==="error"?"Sync error":"Synced");
}

// READ via JSONP — completely bypasses CORS, works on all devices/browsers
function apiGet() {
  if (NO_API) return Promise.resolve(null);
  return new Promise(function(resolve) {
    var cb    = "tfcb_" + Date.now();
    var script = document.createElement("script");
    var done  = false;
    var timer = setTimeout(function() {
      if (!done) { done=true; delete window[cb]; if(script.parentNode) script.remove(); resolve(null); }
    }, 15000);
    window[cb] = function(data) {
      if (!done) { done=true; clearTimeout(timer); delete window[cb]; if(script.parentNode) script.remove(); resolve(data); }
    };
    script.onerror = function() {
      if (!done) { done=true; clearTimeout(timer); delete window[cb]; resolve(null); }
    };
    script.src = API_URL + "?callback=" + cb + "&t=" + Date.now();
    document.head.appendChild(script);
  });
}

// WRITE via POST with text/plain — no CORS preflight, handles large payloads
function apiPost(body) {
  if (NO_API) return Promise.resolve(null);
  setSync("syncing");
  return new Promise(function(resolve) {
    var cb     = "tfwcb_" + Date.now();
    var script = document.createElement("script");
    var done   = false;
    var timer  = setTimeout(function() {
      if (!done) { done=true; delete window[cb]; if(script.parentNode) script.remove(); setSync("error","Timeout"); resolve(null); }
    }, 15000);
    window[cb] = function(data) {
      if (!done) { done=true; clearTimeout(timer); delete window[cb]; if(script.parentNode) script.remove(); setSync(data&&data.ok?"idle":"error"); resolve(data); }
    };
    script.onerror = function() {
      if (!done) { done=true; clearTimeout(timer); delete window[cb]; setSync("error","Offline"); resolve(null); }
    };
    script.src = API_URL + "?callback=" + cb + "&payload=" + encodeURIComponent(JSON.stringify(body)) + "&t=" + Date.now();
    document.head.appendChild(script);
  });
}

function localSave() {
  try{
    localStorage.setItem("tf-tasks",        JSON.stringify(tasks));
    localStorage.setItem("tf-appts",        JSON.stringify(appointments));
    localStorage.setItem("tf-comps",        JSON.stringify(completions));
    localStorage.setItem("tf-notes",        JSON.stringify(notes));
    localStorage.setItem("tf-birthdays",    JSON.stringify(birthdays));
  }catch(e){}
}
function localLoad() {
  try{
    tasks=JSON.parse(localStorage.getItem("tf-tasks")||"[]");
    appointments=JSON.parse(localStorage.getItem("tf-appts")||"{}");
    completions=JSON.parse(localStorage.getItem("tf-comps")||"{}");
    notes=JSON.parse(localStorage.getItem("tf-notes")||"[]");
    birthdays=JSON.parse(localStorage.getItem("tf-birthdays")||"[]");
    // Ensure subtask completedDates arrays exist
    tasks = tasks.map(function(t) {
      if (!t.subtasks) t.subtasks = [];
      t.permanentlyDone = !!t.permanentlyDone;
      t.critical = !!t.critical;
      t.subtasks = t.subtasks.map(function(st) {
        if (!st.completedDates) st.completedDates = [];
        return st;
      });
      return t;
    });
  }catch(e){}
}

function loadData() {
  localLoad(); renderAll(); setSync("syncing","Loading...");
  apiGet().then(function(data){
    if(!data||!data.ok){ setSync(NO_API?"idle":"error",NO_API?"Local only":"Offline"); return; }
    // Preserve local state before sheet overwrites
    var localDoneMap = {};
    var localCompletedTodayMap = {};
    var t = todayStr();
    tasks.forEach(function(lt) {
      if (lt.permanentlyDone) localDoneMap[lt.id] = true;
      // Preserve today's completedDates in case sheet hasn't caught up
      if (lt.completedDates && lt.completedDates.indexOf(t) !== -1) {
        localCompletedTodayMap[lt.id] = true;
      }
    });

    tasks=(data.tasks||[]).map(function(t){
    t.startDate=normalizeDate(t.startDate);
    t.dueDate=normalizeDate(t.dueDate);
    // Parse subtasks JSON if stored as string
    if (typeof t.subtasks === "string") {
      try { t.subtasks = JSON.parse(t.subtasks); } catch(e) { t.subtasks = []; }
    }
    if (!t.subtasks) t.subtasks = [];
    // Ensure every subtask has a completedDates array
    t.subtasks = t.subtasks.map(function(st) {
      if (!st.completedDates) st.completedDates = [];
      return st;
    });
    // Normalize permanentlyDone - preserve local state if sheet hasn't caught up yet
    var sheetDone = (t.permanentlyDone === true || t.permanentlyDone === "true" || t.permanentlyDone === "TRUE");
    t.permanentlyDone = sheetDone || !!localDoneMap[t.id];
    t.critical = (t.critical === true || t.critical === "true" || t.critical === "TRUE");
    // Restore today's completion if local had it but sheet hasn't caught up
    if (localCompletedTodayMap[t.id]) {
      t.completedDates = t.completedDates || [];
      if (t.completedDates.indexOf(todayStr()) === -1) {
        t.completedDates.push(todayStr());
      }
    }
    return t;
  });
    var merged={};
    tasks.forEach(function(t){ (t.completedDates||[]).forEach(function(d){ merged[t.id+"|"+d]=true; }); });
    Object.keys(completions).forEach(function(k){ if(k.slice(-10)===todayStr()) merged[k]=true; });
    completions=merged; // Normalize appointment date keys from sheet
var rawAppts = data.appts || {};
var normAppts = {};
Object.keys(rawAppts).forEach(function(k) {
  normAppts[normalizeDate(k)] = rawAppts[k];
});
appointments = normAppts;
    if (data.notes) { notes = data.notes; }
    if (data.birthdays) { birthdays = data.birthdays; }
    localSave(); setSync("idle"); renderAll();
  });
}

// Modal subtask state (temporary while modal is open)
var modalSubtasks = []; // [{id, name}]

function renderModalSubtasks() {
  var list = document.getElementById("subtask-list-edit");
  if (!list) return;
  if (modalSubtasks.length === 0) { list.innerHTML = ""; return; }
  list.innerHTML = modalSubtasks.map(function(st, i) {
    return '<div class="subtask-edit-item">'

      + '</div>';
  }).join("");
}

function addModalSubtask() {

function saveTaskForm() {
  var name=document.getElementById("f-name").value.trim();
  if(!name){ document.getElementById("f-name").focus(); return; }
  var existing = editingId ? (tasks.find(function(t){return t.id===editingId;}) || {}) : {};
  var task={
    id: editingId||makeUUID(), name: name,
    entity: document.getElementById("f-entity").value.trim(),
    startDate: normalizeDate(document.getElementById("f-start").value),
    dueDate:   normalizeDate(document.getElementById("f-due").value),
    recurrence: document.getElementById("f-rec").value,
    completedDates: existing.completedDates || [],
    subtasks: modalSubtasks.slice(),
    critical: modalCritical,
    permanentlyDone: existing.permanentlyDone || false
  };
  var idx=tasks.findIndex(function(t){return t.id===task.id;});
  if(idx>=0) tasks[idx]=task; else tasks.push(task);
  closeModal(); localSave(); renderAll(); apiPost({action:"saveTask",task:task});
}

function deleteTask(id) {
  if(!confirm("Delete this task?")) return;
  tasks=tasks.filter(function(t){return t.id!==id;});
  Object.keys(completions).forEach(function(k){if(k.indexOf(id+"|")===0) delete completions[k];});
  localSave(); renderAll(); apiPost({action:"deleteTask",id:id});
}

function spawnNextOccurrence(task) {
  var nextStart=nextOccurrence(task,task.startDate);
  var nextDue=nextOccurrence(task,task.dueDate);
  var exists=tasks.some(function(tk){ return tk.name===task.name&&tk.entity===task.entity&&tk.recurrence===task.recurrence&&tk.dueDate===nextDue&&tk.id!==task.id; });
  if(!exists){
    // Carry subtasks forward, reset all their completedDates
    var nextSubtasks = (task.subtasks||[]).map(function(st){
      return {id:makeUUID(), name:st.name, completedDates:[]};
    });
    var nt={id:makeUUID(),name:task.name,entity:task.entity,startDate:nextStart,dueDate:nextDue,recurrence:task.recurrence,completedDates:[],subtasks:nextSubtasks,critical:false,permanentlyDone:false};
    tasks.push(nt); apiPost({action:"saveTask",task:nt});
  }
}

function toggleExpand(taskId) {
  expandedTasks[taskId] = !expandedTasks[taskId];
  renderTasks();
}

function toggleSubtask(taskId, subtaskId) {
  var task = tasks.find(function(t){return t.id===taskId;});
  if (!task || !task.subtasks) return;
  var st = task.subtasks.find(function(s){return s.id===subtaskId;});
  if (!st) return;
  if (!st.completedDates) st.completedDates = [];
  var t = todayStr();
  var idx = st.completedDates.indexOf(t);
  if (idx >= 0) st.completedDates.splice(idx, 1);
  else st.completedDates.push(t);
  localSave(); renderAll(); apiPost({action:"saveTask", task:task});
}

function isSubtaskDone(st) {
  return st.completedDates && st.completedDates.indexOf(todayStr()) >= 0;
}

function getSubtaskProgress(task) {
  if (!task.subtasks || task.subtasks.length === 0) return null;
  var done = task.subtasks.filter(function(st){return isSubtaskDone(st);}).length;
  return {done: done, total: task.subtasks.length};
}

function allSubtasksDone(task) {
  if (!task.subtasks || task.subtasks.length === 0) return true;
  return task.subtasks.every(function(st){return isSubtaskDone(st);});
}

function toggleComplete(id) {
  var task = tasks.find(function(t){return t.id===id;});
  if (!task) return;

  if (task.permanentlyDone) {
    // Un-complete: bring back as pending
    task.permanentlyDone = false;
    var key = id+"|"+todayStr();
    delete completions[key];
    task.completedDates = (task.completedDates||[]).filter(function(d){ return d !== todayStr(); });
  } else {
    // Complete: permanently done for both one-time AND recurring
    task.permanentlyDone = true;
    // Always record today's completion date
    task.completedDates = task.completedDates || [];
    if (task.completedDates.indexOf(todayStr()) === -1) {
      task.completedDates.push(todayStr());
    }
    var key2 = id+"|"+todayStr();
    completions[key2] = true;
    if (task.recurrence !== "none") {
      spawnNextOccurrence(task);
    }
  }

  apiPost({action:"saveTask", task:task});
  localSave();
  renderAll();
}

function addAppt(date,text) {
  if(!text||!text.trim()) return;
  if(!appointments[date]) appointments[date]=[];
  appointments[date].push(text.trim());
  localSave(); renderWeek(); apiPost({action:"saveAppts",date:date,appts:appointments[date]});
}

function removeAppt(date,idx) {
  if(!appointments[date]) return;
  appointments[date].splice(idx,1);
  localSave(); renderWeek(); apiPost({action:"saveAppts",date:date,appts:appointments[date]});
}

function moveAppt(date, fromIdx, toIdx) {
  if (!appointments[date]) return;
  if (fromIdx === toIdx) return;
  var arr = appointments[date];
  var item = arr.splice(fromIdx, 1)[0];
  arr.splice(toIdx, 0, item);
  localSave(); renderWeek(); apiPost({action:"saveAppts", date:date, appts:appointments[date]});
}

function toggleCriticalInline(id) {

}

function getBdayForDate(dateStr) {
  var mmdd = dateStr.slice(5);
  return birthdays.filter(function(b){ return b.date === mmdd; });
}

function renderWeek() {
  var days=getWeekDays(), t=todayStr(), dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var fp=days[0].split("-"), lp=days[6].split("-");
  var first=new Date(parseInt(fp[0]),parseInt(fp[1])-1,parseInt(fp[2]));
  var last=new Date(parseInt(lp[0]),parseInt(lp[1])-1,parseInt(lp[2]));
  var ml=(first.getMonth()===last.getMonth())
    ?first.toLocaleDateString("en-US",{month:"long",year:"numeric"})
    :first.toLocaleDateString("en-US",{month:"short"})+" – "+last.toLocaleDateString("en-US",{month:"short",year:"numeric"});
  var _mlEl=document.getElementById("week-month-label"); if(_mlEl) _mlEl.textContent=ml;

  var html="";
  for(var i=0;i<days.length;i++){
    var date=days[i], isToday=date===t, isPast=date<t;
    var appts=appointments[date]||[], dayNum=new Date(date+"T12:00:00").getDate();
    var cls="day-col"+(isToday?" is-today":(isPast?" is-past":""));
    var apptHtml="";
    // Add birthday entries for this date (not draggable, no delete)
    var bdaysOnDay = getBdayForDate(date);
    var bdayHtml = "";
    bdaysOnDay.forEach(function(b) {
      var name = [b.first, b.last].filter(Boolean).join(" ");
      bdayHtml += '<div class="appt-item appt-bday">'
        +'<div class="appt-dot"></div>'
        +'<span class="appt-txt">&#127881; '+eh(name)+'&#39;s birthday</span>'
        +'</div>';
    });
    if(appts.length===0 && bdayHtml === ""){ apptHtml='<div class="appt-empty">—</div>'; }
    else {
      apptHtml = bdayHtml;
      for(var ai=0;ai<appts.length;ai++){
        apptHtml+='<div class="appt-item" draggable="true" data-date="'+date+'" data-idx="'+ai+'">'
          +'<span class="appt-drag-handle">⠿</span>'
          +'<span class="appt-txt">'+eh(appts[ai])+'</span>'
          +'<button class="appt-del" data-date="'+date+'" data-idx="'+ai+'">×</button>'
          +'</div>';
      }
    }
    html+='<div class="'+cls+'">'
      +'<div class="day-hd"><div class="day-lbl">'+dayNames[i]+'</div><div class="day-num">'+dayNum+'</div></div>'
      +'<div class="appt-list">'+apptHtml+'</div>'
      +'<div class="appt-input-row">'
      +'<input class="appt-inp" id="ai-'+date+'" placeholder="+" data-date="'+date+'"/>'
      +'<button class="appt-add" id="ab-'+date+'" data-date="'+date+'" style="display:none"><span style="pointer-events:none;font-weight:300;font-size:14px;line-height:1">+</span></button>'
      +'</div></div>';
  }
  document.getElementById("week-grid").innerHTML=html;

  for(var i=0;i<days.length;i++){
    (function(date){
      var inp=document.getElementById("ai-"+date), btn=document.getElementById("ab-"+date);
      if(!inp||!btn) return;
      inp.addEventListener("input",function(){ btn.style.display=inp.value.trim()?"flex":"none"; });
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter"&&inp.value.trim()){ addAppt(date,inp.value); inp.value=""; btn.style.display="none"; } });
      btn.addEventListener("click",function(){ if(inp.value.trim()){ addAppt(date,inp.value); inp.value=""; btn.style.display="none"; } });
    })(days[i]);
  }
  // Click delegation (delete)
  var weekGrid = document.getElementById("week-grid");
  weekGrid.addEventListener("click", function(e) {
    var del = e.target.closest(".appt-del");
    if (del) removeAppt(del.getAttribute("data-date"), parseInt(del.getAttribute("data-idx"), 10));
  });

  // Drag-to-reorder within a day column
  var dragSrcDate = null;
  var dragSrcIdx  = null;

  weekGrid.addEventListener("dragstart", function(e) {
    var item = e.target.closest(".appt-item");
    if (!item) return;
    dragSrcDate = item.getAttribute("data-date");
    dragSrcIdx  = parseInt(item.getAttribute("data-idx"), 10);
    item.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });

  weekGrid.addEventListener("dragend", function() {
    weekGrid.querySelectorAll(".appt-item").forEach(function(el) {
      el.classList.remove("dragging","drag-over-top","drag-over-bottom");
    });
  });

  weekGrid.addEventListener("dragover", function(e) {
    e.preventDefault();
    var item = e.target.closest(".appt-item");
    weekGrid.querySelectorAll(".appt-item").forEach(function(el) {
      el.classList.remove("drag-over-top","drag-over-bottom");
    });
    if (!item) return;
    var rect = item.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) item.classList.add("drag-over-top");
    else item.classList.add("drag-over-bottom");
    e.dataTransfer.dropEffect = "move";
  });

  weekGrid.addEventListener("drop", function(e) {
    e.preventDefault();
    var item = e.target.closest(".appt-item");
    if (!item) return;
    var tgtDate = item.getAttribute("data-date");
    var tgtIdx  = parseInt(item.getAttribute("data-idx"), 10);
    if (tgtDate !== dragSrcDate || tgtIdx === dragSrcIdx) return;
    var rect = item.getBoundingClientRect();
    var insertIdx = (e.clientY >= rect.top + rect.height / 2) ? tgtIdx + 1 : tgtIdx;
    if (dragSrcIdx < insertIdx) insertIdx--;
    moveAppt(dragSrcDate, dragSrcIdx, insertIdx);
  });
}

function saveNotes() {

}

function addNote() {
  notes.push({id:makeUUID(), title:"", body:"", order:notes.length});
  saveNotes();
  renderNotes();

    var inputs = document.querySelectorAll(".note-title-inp");

function deleteNote(id) {
  notes = notes.filter(function(n){return n.id!==id;});
  saveNotes();
  renderNotes();
}

function updateNoteTitle(id, val) {
  var n = notes.find(function(n){return n.id===id;});
  if (n) { n.title = val; saveNotes(); }
}

function updateNoteBody(id, val) {
  var n = notes.find(function(n){return n.id===id;});
  if (n) { n.body = val; saveNotes(); }
}

function updateNoteHeight(id, height) {
  var n = notes.find(function(n){return n.id===id;});
  if (n && height && height !== n.height) {
    n.height = height;
    saveNotes();
  }
}

function renderNotes() {
  var grid = document.getElementById("notes-grid");
  if (!grid) return;

  // Sort by order
  var sorted = notes.slice().sort(function(a,b){return (a.order||0)-(b.order||0);});

  if (sorted.length === 0) {
    grid.innerHTML = '<div style="color:var(--color-text-tertiary);font-size:.78rem;grid-column:1/-1;padding:.5rem 0">No notes yet — click Add note to get started.</div>';
    return;
  }

  grid.innerHTML = sorted.map(function(note) {
    var imgSection = note.imageData
      ? '<div class="note-img-wrap">'
        + '<img class="note-img" src="'+note.imageData+'" alt="note image"/>'
        + '<button class="note-img-del" data-noteid="'+note.id+'" title="Remove image">'
        + '×'
        + '</button>'
        + '</div>'
      : '';

    return '<div class="note-card" draggable="true" data-noteid="'+note.id+'">'
      +'<div class="note-card-header">'
      +'<span class="note-drag-handle" style="pointer-events:none;letter-spacing:1px;font-size:10px;color:var(--color-text-tertiary)">⠿</span>'
      +'<input class="note-title-inp" placeholder="Title..." value="'+eh(note.title||"")+'" data-noteid="'+note.id+'" />'
      +'<button class="note-del-btn" data-noteid="'+note.id+'" title="Delete note">'
      +'<span style="pointer-events:none;font-size:12px">&#128465;</span>'
      +'</button>'
      +'</div>'
      + imgSection
      +'<textarea class="note-body-inp" placeholder="Type notes here... (paste image with Ctrl+V / Cmd+V)" data-noteid="'+note.id+'"'+(note.height?' style="height:'+note.height+'px"':'')+' ></textarea>'
      +'<label class="note-img-upload-lbl" style="display:flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-top:0.5px solid var(--color-border);font-size:.65rem;color:var(--color-text-tertiary);cursor:pointer;background:none">'
      +'<span>&#128247; Add image</span>'
      +'<input type="file" accept="image/*" class="note-file-input" data-noteid="'+note.id+'" style="display:none"/>'
      +'</label>'
      +'</div>';
  }).join("");

  wireNoteEvents();
}

var dragSrcId = null;

function compressAndSaveImage(noteId, file, dataUrlIn) {
  function process(dataUrl) {
    var img = new Image();
    img.onload = function() {
      var maxW = 800, maxH = 600;
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL("image/jpeg", 0.75);
      var n = notes.find(function(n){ return n.id === noteId; });
      if (n) { n.imageData = compressed; saveNotes(); renderNotes(); }
    };
    img.src = dataUrl;
  }
  if (dataUrlIn) {
    process(dataUrlIn);
  } else if (file) {
    var reader = new FileReader();
    reader.onload = function(ev) { process(ev.target.result); };
    reader.readAsDataURL(file);
  }
}

function wireNoteEvents() {
  var grid = document.getElementById("notes-grid");
  if (!grid) return;

  // Title inputs
  grid.querySelectorAll(".note-title-inp").forEach(function(inp) {
    inp.addEventListener("change", function(){ updateNoteTitle(this.getAttribute("data-noteid"), this.value); });
    inp.addEventListener("blur", function(){ updateNoteTitle(this.getAttribute("data-noteid"), this.value); });
  });

  // Body textareas — text changes and paste
  grid.querySelectorAll(".note-body-inp").forEach(function(ta) {
    var nid = ta.getAttribute("data-noteid");
    var note = notes.find(function(n){ return n.id === nid; });
    // Set existing text value
    if (note) ta.value = note.body || "";

    // Save on blur (reliable) AND debounced input (catches text before refresh)
    ta.addEventListener("blur", function(){ updateNoteBody(nid, this.value); });
    var noteDebounce = null;
    ta.addEventListener("input", function(){
      var val = this.value;
      clearTimeout(noteDebounce);
      noteDebounce = setTimeout(function(){ updateNoteBody(nid, val); }, 1500);
    });
    // Save height after user finishes resizing (mouseup captures drag-resize end)
    ta.addEventListener("mouseup", function(){
      var h = parseInt(this.style.height);
      if (!isNaN(h) && h > 0) updateNoteHeight(nid, h);
    });
    // Also save on blur in case height changed
    ta.addEventListener("blur", function(){
      var h = parseInt(this.style.height);
      if (!isNaN(h) && h > 0) updateNoteHeight(nid, h);
    });

    // Paste handler — intercept image pastes
    ta.addEventListener("paste", function(e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          e.preventDefault();
          var file   = items[i].getAsFile();
          var reader = new FileReader();
          reader.onload = (function(noteId) {
            return function(ev) { compressAndSaveImage(noteId, null, ev.target.result); };
          })(nid);
          reader.readAsDataURL(file);
          return;
        }
      }
    });
  });

  // Image delete buttons
  grid.querySelectorAll(".note-img-del").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var nid = this.getAttribute("data-noteid");
      var n   = notes.find(function(n){ return n.id === nid; });
      if (n) { n.imageData = null; saveNotes(); renderNotes(); }
    });
  });

  // File input for iOS image upload
  grid.querySelectorAll(".note-file-input").forEach(function(inp) {
    var nid = inp.getAttribute("data-noteid");
    inp.addEventListener("change", function() {
      var file = this.files && this.files[0];
      if (!file || !file.type.match(/image/)) return;
      compressAndSaveImage(nid, file);
    });
  });

  // Delete note buttons
  grid.querySelectorAll(".note-del-btn").forEach(function(btn) {
    btn.addEventListener("click", function(){ deleteNote(this.getAttribute("data-noteid")); });
  });

  // Drag and drop
  grid.querySelectorAll(".note-card").forEach(function(card) {
    card.addEventListener("dragstart", function(e) {
      dragSrcId = this.getAttribute("data-noteid");
      this.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", function() {
      this.classList.remove("dragging");
      grid.querySelectorAll(".note-card").forEach(function(c){ c.classList.remove("drag-over"); });
    });
    card.addEventListener("dragover", function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      grid.querySelectorAll(".note-card").forEach(function(c){ c.classList.remove("drag-over"); });
      this.classList.add("drag-over");
    });
    card.addEventListener("drop", function(e) {
      e.preventDefault();
      var targetId = this.getAttribute("data-noteid");
      if (!dragSrcId || dragSrcId === targetId) return;
      // Swap orders
      var src = notes.find(function(n){return n.id===dragSrcId;});
      var tgt = notes.find(function(n){return n.id===targetId;});
      if (src && tgt) {
        var tmp = src.order; src.order = tgt.order; tgt.order = tmp;
        saveNotes();
        renderNotes();
      }
    });
  });
}

function highlightMatch(str) {
  if (!searchQuery || !str) return eh(str);
  var q    = searchQuery;
  var idx  = str.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return eh(str);
  return eh(str.slice(0, idx))
    + '<mark style="background:var(--color-accent-bg);color:var(--color-accent-text);border-radius:2px;padding:0 1px">'
    + eh(str.slice(idx, idx + q.length))
    + '</mark>'
    + eh(str.slice(idx + q.length));
}

function renderTasks() {
  var t=todayStr(), sorted=sortTasks(tasks);
  var showList=(curFilter==="due")
    ?sorted.filter(function(task){ return task.dueDate<=t||task.startDate<=t; })
    :sorted;

  // Exclude permanently done one-time tasks from all views (they are done, gone)
  // but show them at the bottom as struck-through so user can undo
  // Apply search filter
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    showList = showList.filter(function(task){
      return task.name.toLowerCase().indexOf(q) !== -1 ||
             (task.entity && task.entity.toLowerCase().indexOf(q) !== -1);
    });
  }

  var activePending = showList.filter(function(task){
    return !isCompleted(task.id);
  });
  var doneToday = showList.filter(function(task){
    if (!isCompleted(task.id)) return false;
    // In "due" view: only show tasks completed TODAY
    // (one-time: permanentlyDone AND completedDates includes today;
    //  recurring: completedDates includes today)
    if (curFilter === "due") {
      return (task.completedDates || []).indexOf(todayStr()) !== -1;
    }
    // In "all" view: show all completed tasks
    return true;
  });
  var combined = activePending.concat(doneToday);
  var area=document.getElementById("task-area");

  if(!combined.length){
    area.innerHTML='<div class="empty-state"><span style="font-size:2rem;display:block;margin-bottom:.5rem;opacity:.3">☐</span><div style="font-size:.875rem;font-weight:500;margin-bottom:.25rem">No tasks to show</div><div style="font-size:.8rem">Click "New task" to get started</div></div>';
    return;
  }

  var banner=NO_API?'<div class="no-api-banner"><span style="font-size:15px;flex-shrink:0;margin-top:1px;pointer-events:none">⚠</span><span>Google Sheets not connected — data is saved locally on this device only.</span></div>':"";

  var rows="";
  for(var i=0;i<combined.length;i++){
    var task=combined[i];
    var done2=isCompleted(task.id);
    var overdue=!done2&&task.dueDate<t;
    var dueToday2=!done2&&task.dueDate===t;
    var active=!done2&&!overdue&&!dueToday2&&task.startDate<=t;
    var rowCls=done2?"row-done":(task.critical?"row-critical":"");
    var chipCls=overdue?"chip chip-overdue":dueToday2?"chip chip-today":active?"chip chip-active":"chip";
    var recBadge=(task.recurrence!=="none"&&!done2)?'<span class="rec-badge">'+recLabel(task.recurrence)+'</span>':"";
    var critBadge=(task.critical&&!done2)?'<span class="critical-badge">&#9733; Critical</span>':"";
    var prog = getSubtaskProgress(task);
    var progBadge = "";
    var hasSubtasks = task.subtasks && task.subtasks.length > 0;
    var isExpanded = !!expandedTasks[task.id];
    if (prog) {
      var allDone = prog.done === prog.total;
      progBadge = '<span class="progress-badge'+(allDone?" complete":"")+'">'+prog.done+'/'+prog.total+'</span>';
    }
    // Expand/collapse toggle shown only if task has subtasks
    var expandBtn = hasSubtasks
      ? '<button class="expand-btn" data-id="'+task.id+'" title="'+(isExpanded?"Hide":"Show")+' subtasks" style="background:none;border:none;cursor:pointer;padding:0 0 0 .3rem;color:var(--color-text-tertiary);font-size:12px;vertical-align:middle;line-height:1">'
        +'<span style="pointer-events:none;font-size:11px">'+(isExpanded?"▲":"▼")+'</span></button>'
      : "";
    // Parent is only truly done if all subtasks are also done
    var effectiveDone = done2 && allSubtasksDone(task);
    var chkClass = effectiveDone ? "chkbox checked" : "chkbox";
    rows+='<tr class="'+rowCls+' task-draggable" draggable="true" data-taskid="'+task.id+'">'
      +'<td class="td-chk"><button class="'+chkClass+'" data-id="'+task.id+'">'+(effectiveDone?'<span style="pointer-events:none;font-size:10px">✓</span>':'')+'</button></td>'
      +'<td class="td-name">'+highlightMatch(task.name)+critBadge+recBadge+progBadge+expandBtn+'</td>'
      +'<td class="td-ent">'+highlightMatch(task.entity||"")+'</td>'
      +'<td class="td-start">'+fmtDate(task.startDate)+'</td>'
      +'<td class="td-due"><span class="'+chipCls+'">'+fmtDate(task.dueDate)+'</span></td>'
      +'<td class="td-act"><div class="act-btns">'
      +'<button class="act-btn critical-toggle" data-id="'+task.id+'" title="'+(task.critical?"Remove critical":"Mark critical")+'" style="'+(task.critical?'background:var(--color-coral-bg);border-color:var(--color-coral);color:var(--color-coral)':'')+'">'
      +'<i class="ti ti-'+(task.critical?'star-filled':'star')+'" aria-hidden="true" style="font-size:13px"></i>'
      +'</button>'
      +'<button class="act-btn edit-btn" data-id="'+task.id+'" title="Edit"><span style="font-size:12px;pointer-events:none">✎</span></button>'
      +'<button class="act-btn del" data-id="'+task.id+'" title="Delete"><span style="font-size:12px;pointer-events:none">🗑</span></button>'
      +'</div></td></tr>';
    // Render subtask rows only when expanded
    if (hasSubtasks && isExpanded) {
      for (var si = 0; si < task.subtasks.length; si++) {
        var st = task.subtasks[si];
        var stDone = isSubtaskDone(st);
        var stCls = "subtask-row" + (stDone?" row-done":"");
        var stChkCls = stDone?"subtask-chk checked":"subtask-chk";
        rows += '<tr class="'+stCls+'" data-taskid="'+task.id+'" data-stid="'+st.id+'" class="subtask-tr" style="cursor:pointer">'
          +'<td class="td-chk">'
          +'<span class="'+stChkCls+'" style="pointer-events:none">'
          +(stDone?'<span style="pointer-events:none;font-size:10px">✓</span>':'')
          +'</span>'
          +'</td>'
          +'<td class="td-name" colspan="4" style="color:var(--color-text-secondary);font-weight:400;padding-left:1.75rem">'
          +'<span style="font-size:11px;margin-right:.35rem;color:var(--color-text-tertiary);pointer-events:none">↳</span>'
          +eh(st.name)
          +'</td>'
          +'</tr>';
      }
    }
  }

  var tableHtml='<div class="section">'
    +'<div class="sec-head"><div class="sec-head-inner">'
    +'<div class="col-hd"></div>'
    +'<div class="col-hd">Task</div>'
    +'<div class="col-hd hide-sm">Entity</div>'
    +'<div class="col-hd hide-sm">Start</div>'
    +'<div class="col-hd">Due</div>'
    +'<div class="col-hd"></div>'
    +'</div></div>'
    +'<table><tbody>'+rows+'</tbody></table></div>';

  area.innerHTML=banner+tableHtml;
}


// ── TIME BLOCK ────────────────────────────────────────────────────────────────
var TB_HOURS = ["8:00 AM","9:00 AM","10:00 AM","11:00 AM","12:00 PM","1:00 PM","2:00 PM","3:00 PM","4:00 PM","5:00 PM"];
var TB_KEYS  = ["08","09","10","11","12","13","14","15","16","17"];

function loadTimeBlocks() {
  var stored = localStorage.getItem("tf-timeblocks");
  var obj    = stored ? JSON.parse(stored) : {};
  // Reset if stored for a different day
  if (obj.date !== todayStr()) {
    timeBlocks = {};
    TB_KEYS.forEach(function(k){ timeBlocks[k] = []; });
  } else {
    timeBlocks = obj.blocks || {};
    TB_KEYS.forEach(function(k){ if (!timeBlocks[k]) timeBlocks[k] = []; });
  }
  tbDate = todayStr();
}

function saveTimeBlocks() {
  localStorage.setItem("tf-timeblocks", JSON.stringify({date: todayStr(), blocks: timeBlocks}));
}

function toggleTimeBlock() {
  tbOpen = !tbOpen;
  var panel = document.getElementById("tb-panel");
  if (tbOpen) {
    panel.classList.add("open");
    renderTimeBlock();
  } else {
    panel.classList.remove("open");
  }
}

function renderTimeBlock() {
  var panel = document.getElementById("tb-panel");
  if (!panel || !tbOpen) return;

  // Set date label
  var dl = document.getElementById("tb-header-date");
  if (dl) dl.textContent = new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  var body = document.getElementById("tb-body");
  if (!body) return;

  var html = "";
  TB_HOURS.forEach(function(label, i) {
    var key   = TB_KEYS[i];
    var slots = timeBlocks[key] || [];
    // Filter to tasks that still exist
    var validIds = slots.filter(function(id){ return tasks.find(function(t){return t.id===id;}); });
    if (validIds.length !== slots.length) { timeBlocks[key] = validIds; saveTimeBlocks(); }

    var chipHtml = validIds.length === 0
      ? '<div class="tb-empty">Drop task here</div>'
      : validIds.map(function(id) {
          var task = tasks.find(function(t){return t.id===id;});
          if (!task) return "";
          var done = isCompleted(id);
          var cls  = "tb-task-chip" + (task.critical?" critical":"") + (done?" done-chip":"");
          var chkCls = "tb-chip-chk" + (done?" done":"");
          return '<div class="'+cls+'">'
            +'<button class="'+chkCls+'" data-tbid="'+id+'" title="Complete">'+( done?"&#10003;":"" )+'</button>'
            +'<span class="tb-task-name" title="'+eh(task.name)+'">'+eh(task.name)+'</span>'
            +'<button class="tb-chip-btn tb-edit-btn" data-tbid="'+id+'" title="Edit">&#9998;</button>'
            +'<button class="tb-chip-btn tb-remove-btn" data-tbid="'+id+'" data-tbkey="'+key+'" title="Remove from slot">&#10005;</button>'
            +'</div>';
        }).join("");

    html += '<div class="tb-slot" data-tbkey="'+key+'">'
      +'<div class="tb-slot-label">'+label+'</div>'
      +'<div class="tb-slot-tasks">'+chipHtml+'</div>'
      +'</div>';
  });

  body.innerHTML = html;
  wireTbEvents();
}

function wireTbEvents() {
  var body = document.getElementById("tb-body");
  if (!body) return;

  // Slot drop targets
  body.querySelectorAll(".tb-slot").forEach(function(slot) {
    slot.addEventListener("dragover", function(e) {
      if (!tbDragTaskId) return;
      e.preventDefault();
      body.querySelectorAll(".tb-slot").forEach(function(s){ s.classList.remove("drag-over"); });
      slot.classList.add("drag-over");
    });
    slot.addEventListener("dragleave", function() { slot.classList.remove("drag-over"); });
    slot.addEventListener("drop", function(e) {
      e.preventDefault();
      slot.classList.remove("drag-over");
      if (!tbDragTaskId) return;
      var key = slot.getAttribute("data-tbkey");
      // Remove from any existing slot first
      TB_KEYS.forEach(function(k){
        timeBlocks[k] = (timeBlocks[k]||[]).filter(function(id){return id!==tbDragTaskId;});
      });
      if (!timeBlocks[key]) timeBlocks[key] = [];
      if (timeBlocks[key].indexOf(tbDragTaskId) === -1) timeBlocks[key].push(tbDragTaskId);
      saveTimeBlocks();
      tbDragTaskId = null;
      renderTimeBlock();
    });
  });

  // Chip buttons via delegation
  body.addEventListener("click", function(e) {
    var chk = e.target.closest(".tb-chip-chk");
    if (chk) { toggleComplete(chk.getAttribute("data-tbid")); renderTimeBlock(); return; }
    var edit = e.target.closest(".tb-edit-btn");
    if (edit) {
      var id = edit.getAttribute("data-tbid");
      var task = tasks.find(function(t){return t.id===id;});
      if (task) openModal(task);
      return;
    }
    var remove = e.target.closest(".tb-remove-btn");
    if (remove) {
      var key = remove.getAttribute("data-tbkey");
      var id  = remove.getAttribute("data-tbid");
      timeBlocks[key] = (timeBlocks[key]||[]).filter(function(i){return i!==id;});
      saveTimeBlocks();
      renderTimeBlock();
      return;
    }
  });
}

// Make panel draggable
(function() {
  var panel, isDragging = false, startX, startY, startLeft, startBottom;
  document.addEventListener("DOMContentLoaded", function() {
    panel = document.getElementById("tb-panel");
    var header = document.getElementById("tb-header");
    if (!header) return;
    header.addEventListener("mousedown", function(e) {
      if (e.target.closest("#tb-close")) return;
      isDragging = true;
      var rect = panel.getBoundingClientRect();
      startX    = e.clientX;
      startY    = e.clientY;
      startLeft = rect.left;
      startBottom = window.innerHeight - rect.bottom;
      e.preventDefault();
    });
    document.addEventListener("mousemove", function(e) {
      if (!isDragging) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var newLeft   = Math.max(0, Math.min(window.innerWidth  - panel.offsetWidth,  startLeft   + dx));
      var newBottom = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, startBottom - dy));
      panel.style.left   = newLeft   + "px";
      panel.style.bottom = newBottom + "px";
      panel.style.right  = "auto";
    });
    document.addEventListener("mouseup", function() { isDragging = false; });
    // Touch support
    header.addEventListener("touchstart", function(e) {
      if (e.target.closest("#tb-close")) return;
      var touch = e.touches[0];
      isDragging = true;
      var rect  = panel.getBoundingClientRect();
      startX    = touch.clientX;
      startY    = touch.clientY;
      startLeft = rect.left;
      startBottom = window.innerHeight - rect.bottom;
    }, {passive:true});
    document.addEventListener("touchmove", function(e) {
      if (!isDragging) return;
      var touch = e.touches[0];
      var dx = touch.clientX - startX;
      var dy = touch.clientY - startY;
      var newLeft   = Math.max(0, Math.min(window.innerWidth  - panel.offsetWidth,  startLeft   + dx));
      var newBottom = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, startBottom - dy));
      panel.style.left   = newLeft   + "px";
      panel.style.bottom = newBottom + "px";
      panel.style.right  = "auto";
    }, {passive:true});
    document.addEventListener("touchend", function() { isDragging = false; });
  });
})();

// ── BIRTHDAYS ─────────────────────────────────────────────────────────────────
var birthdays   = []; // [{id, first, last, date:"MM-DD", note}]
var bdayEditing = null;

function saveBirthdaysToSheet() {
  localSave();
  apiPost({action:"saveBirthdays", birthdays:birthdays});
}

function addBirthday() {
  var first = document.getElementById("bf-first").value.trim();
  var last  = document.getElementById("bf-last").value.trim();
  var date  = document.getElementById("bf-date").value;
  if (!first || !date) { document.getElementById("bf-first").focus(); return; }
  // Store only MM-DD so it recurs every year
  var mmdd  = date.slice(5); // "YYYY-MM-DD" -> "MM-DD"
  var entry = { id: bdayEditing||makeUUID(), first:first, last:last, date:mmdd, note:document.getElementById("bf-note").value.trim() };
  var idx   = birthdays.findIndex(function(b){return b.id===entry.id;});
  if (idx >= 0) birthdays[idx] = entry; else birthdays.push(entry);
  bdayEditing = null;
  closeBdayForm();
  saveBirthdaysToSheet();
  renderBirthdays();
  renderWeek(); // refresh calendar to show birthday
}

function editBirthday(id) {
  var b = birthdays.find(function(b){return b.id===id;});
  if (!b) return;
  bdayEditing = id;
  document.getElementById("bf-first").value = b.first || "";
  document.getElementById("bf-last").value  = b.last  || "";
  // Reconstruct a full date for the input - use current year
  var yr = new Date().getFullYear();
  document.getElementById("bf-date").value  = yr + "-" + b.date;
  document.getElementById("bf-note").value  = b.note  || "";
  document.getElementById("bday-form").classList.add("open");
}

function deleteBirthday(id) {
  birthdays = birthdays.filter(function(b){return b.id!==id;});
  saveBirthdaysToSheet();
  renderBirthdays();
  renderWeek();
}

function closeBdayForm() {
  bdayEditing = null;
  document.getElementById("bday-form").classList.remove("open");
  document.getElementById("bf-first").value = "";
  document.getElementById("bf-last").value  = "";
  document.getElementById("bf-date").value  = "";
  document.getElementById("bf-note").value  = "";
}

function renderBirthdays() {
  var list = document.getElementById("bday-list");
  if (!list) return;
  if (birthdays.length === 0) {
    list.innerHTML = '<div style="color:var(--color-text-tertiary);font-size:.8rem;padding:1rem 0">No birthdays yet — click Add Birthday to get started.</div>';
    return;
  }

  var today  = todayStr();
  var todayMmdd = today.slice(5);

  // Sort by MM-DD
  var sorted = birthdays.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });

  // Find upcoming in next 30 days
  var upcoming = {};
  var now = new Date();
  for (var i = 0; i <= 30; i++) {
    var d = new Date(now);
    d.setDate(now.getDate() + i);
    var mmdd = (d.getMonth()+1+"").padStart(2,"0") + "-" + (d.getDate()+"").padStart(2,"0");
    upcoming[mmdd] = i; // days until
  }

  var rows = sorted.map(function(b) {
    var isToday   = b.date === todayMmdd;
    var daysUntil = upcoming.hasOwnProperty(b.date) ? upcoming[b.date] : null;
    var badge     = isToday
      ? '<span class="bday-upcoming bday-today">Today! &#127881;</span>'
      : (daysUntil !== null && daysUntil > 0)
        ? '<span class="bday-upcoming">In '+daysUntil+' day'+(daysUntil===1?'':'s')+'</span>'
        : '';
    var name = [b.first, b.last].filter(Boolean).join(" ");
    var mnth = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][parseInt(b.date.slice(0,2))-1];
    var day  = parseInt(b.date.slice(3));
    return '<tr>'
      +'<td>'+eh(name)+badge+'</td>'
      +'<td>'+mnth+' '+day+'</td>'
      +'<td style="color:var(--color-text-tertiary)">'+eh(b.note||'')+'</td>'
      +'<td style="text-align:right;white-space:nowrap">'
      +'<button class="bday-edit-btn" data-id="'+b.id+'" style="background:none;border:0.5px solid var(--color-border);border-radius:var(--radius-sm);padding:.2rem .45rem;cursor:pointer;font-size:.72rem;color:var(--color-text-secondary);margin-right:.3rem">Edit</button>'
      +'<button class="bday-del-btn" data-id="'+b.id+'" style="background:none;border:0.5px solid var(--color-border);border-radius:var(--radius-sm);padding:.2rem .45rem;cursor:pointer;font-size:.72rem;color:var(--color-danger)">Del</button>'
      +'</td>'
      +'</tr>';
  }).join("");

  list.innerHTML = '<table class="bday-table"><thead><tr><th>Name</th><th>Date</th><th>Note</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
  list.addEventListener("click", function(e) {
    var editBtn = e.target.closest(".bday-edit-btn");
    if (editBtn) { editBirthday(editBtn.getAttribute("data-id")); return; }
    var delBtn  = e.target.closest(".bday-del-btn");
    if (delBtn)  { deleteBirthday(delBtn.getAttribute("data-id")); return; }
  });
}
