<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>TaskFlow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root {
  --color-bg: #FAF9F7;
  --color-surface: #FFFFFF;
  --color-surface-2: #F5F3F0;
  --color-border: rgba(0,0,0,0.1);
  --color-border-strong: rgba(0,0,0,0.18);
  --color-text-primary: #1a1915;
  --color-text-secondary: #6b6860;
  --color-text-tertiary: #9c9a96;
  --color-accent: #BA7517;
  --color-accent-bg: #FAEEDA;
  --color-accent-mid: #EF9F27;
  --color-accent-text: #633806;
  --color-coral: #D85A30;
  --color-coral-bg: #FAECE7;
  --color-coral-text: #4A1B0C;
  --color-danger: #E24B4A;
  --color-danger-bg: #FCEBEB;
  --color-success: #1D9E75;
  --color-success-bg: #E1F5EE;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1a1915;
    --color-surface: #252420;
    --color-surface-2: #2e2c28;
    --color-border: rgba(255,255,255,0.1);
    --color-border-strong: rgba(255,255,255,0.18);
    --color-text-primary: #f0ede8;
    --color-text-secondary: #a8a49e;
    --color-text-tertiary: #6b6860;
    --color-accent: #FAC775;
    --color-accent-bg: #412402;
    --color-accent-mid: #EF9F27;
    --color-accent-text: #FAEEDA;
    --color-coral: #F0997B;
    --color-coral-bg: #4A1B0C;
    --color-coral-text: #FAECE7;
    --color-danger: #F09595;
    --color-danger-bg: #501313;
    --color-success: #5DCAA5;
    --color-success-bg: #04342C;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;font-family:var(--font);background:var(--color-bg);color:var(--color-text-primary);-webkit-tap-highlight-color:transparent}
input,select,button,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none}
input::placeholder{color:var(--color-text-tertiary)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(0)}
select option{background:var(--color-surface)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--color-border-strong);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Week strip ── */
#week-strip{background:var(--color-surface);border-bottom:0.5px solid var(--color-border);padding:1rem 1.25rem 1rem}
#week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.brand{display:flex;align-items:center;gap:.5rem}
.brand-icon{width:28px;height:28px;background:var(--color-accent-mid);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.brand-name{font-size:1rem;font-weight:500;color:var(--color-text-primary);letter-spacing:-.01em}
.wk-meta{text-align:right}
.wk-range{font-size:.75rem;color:var(--color-text-tertiary);font-family:var(--font-mono)}
#week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.375rem;height:clamp(160px,24vh,260px)}

/* ── Day column ── */
.day-col{display:flex;flex-direction:column;background:var(--color-surface-2);border:0.5px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;min-height:0}
.day-col.is-today{background:var(--color-accent-bg);border:1.5px solid var(--color-accent-mid)}
.day-hd{padding:.4rem .35rem .35rem;text-align:center;flex-shrink:0;border-bottom:0.5px solid var(--color-border)}
.day-col.is-today .day-hd{border-bottom-color:rgba(186,117,23,.25)}
.day-lbl{font-size:.58rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-tertiary)}
.day-col.is-today .day-lbl{color:var(--color-accent)}
.day-col.is-past .day-lbl{color:var(--color-text-tertiary);opacity:.5}
.day-num{width:22px;height:22px;margin:.15rem auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500;color:var(--color-text-secondary);font-family:var(--font-mono)}
.day-col.is-today .day-num{background:var(--color-accent-mid);color:#fff}
.day-col.is-past .day-num{opacity:.4}
.appt-list{flex:1;overflow-y:auto;padding:.3rem .3rem .2rem}
.appt-empty{font-size:.6rem;color:var(--color-text-tertiary);text-align:center;padding:.5rem 0;opacity:.5}
.appt-item{display:flex;align-items:flex-start;gap:.2rem;padding:.2rem .25rem;margin-bottom:.18rem;background:var(--color-surface);border-radius:var(--radius-sm);border:0.5px solid var(--color-border)}
.day-col.is-today .appt-item{background:rgba(239,159,39,.08);border-color:rgba(186,117,23,.2)}
.appt-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:.25rem;background:var(--color-text-tertiary)}
.day-col.is-today .appt-dot{background:var(--color-accent)}
.appt-txt{flex:1;font-size:.63rem;line-height:1.35;color:var(--color-text-primary);word-break:break-word}
.day-col.is-past .appt-txt{color:var(--color-text-tertiary)}
.appt-del{background:none;border:none;padding:0;opacity:.3;display:flex;align-items:center;flex-shrink:0;cursor:pointer;color:var(--color-text-secondary);font-size:11px}
.appt-del:hover{opacity:.7}
.appt-input-row{border-top:0.5px solid var(--color-border);padding:.25rem .3rem;flex-shrink:0;display:flex;gap:.18rem;align-items:center}
.day-col.is-today .appt-input-row{background:rgba(239,159,39,.04)}
.appt-inp{flex:1;background:transparent;border:none;color:var(--color-text-primary);font-size:.65rem;outline:none;padding:.1rem 0;min-width:0}
.appt-add{background:var(--color-accent-mid);border-radius:4px;width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;color:#fff;font-size:11px}

/* ── Controls ── */
#controls{background:var(--color-surface);border-bottom:0.5px solid var(--color-border);padding:.625rem 1.25rem;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
#ctrl-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.today-str{font-size:.72rem;color:var(--color-text-tertiary);font-weight:400}
.filter-btns{display:flex;gap:.25rem}
.fbtn{padding:.3rem .7rem;border-radius:var(--radius-md);font-size:.72rem;font-weight:400;border:0.5px solid var(--color-border-strong);color:var(--color-text-secondary);background:transparent;white-space:nowrap;cursor:pointer;transition:all .15s}
.fbtn:hover{background:var(--color-surface-2)}
.fbtn.active{background:var(--color-accent-bg);border-color:var(--color-accent-mid);color:var(--color-accent-text)}
.new-btn{background:var(--color-accent-mid);color:#fff;border-radius:var(--radius-md);padding:.35rem .85rem;font-size:.75rem;font-weight:500;display:flex;align-items:center;gap:.3rem;flex-shrink:0;cursor:pointer;border:none;transition:opacity .15s}
.new-btn:hover{opacity:.88}
.sync-row{font-size:.65rem;color:var(--color-text-tertiary);display:flex;align-items:center;gap:.3rem}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--color-success)}
.sync-dot.syncing{width:8px;height:8px;border:1.5px solid var(--color-accent-mid);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;background:transparent}
.sync-dot.error{background:var(--color-danger)}

/* ── Task area ── */
#task-area{padding:1rem 1.25rem 2rem}
.section{border-radius:var(--radius-lg);overflow:hidden;border:0.5px solid var(--color-border)}
.sec-head{padding:.5rem .875rem;border-bottom:0.5px solid var(--color-border)}
.sec-head-inner{display:grid;grid-template-columns:32px 1fr 130px 95px 100px 56px;gap:0}
.col-hd{padding:.4rem .6rem;font-size:.62rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-tertiary)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:.5rem .6rem;vertical-align:middle;border-bottom:0.5px solid var(--color-border);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s;background:var(--color-surface)}
tbody tr:nth-child(even){background:var(--color-surface-2)}
tbody tr:hover{background:var(--color-accent-bg);opacity:.95}
tbody tr.row-done{opacity:.5}
.td-chk{width:32px;text-align:center;padding-left:.5rem;padding-right:0}
.td-name{font-weight:400;color:var(--color-text-primary);white-space:normal}
.row-done .td-name{text-decoration:line-through;color:var(--color-text-tertiary)}
.td-ent{color:var(--color-text-secondary);width:130px;font-size:.75rem}
.td-start{color:var(--color-text-tertiary);width:95px;font-family:var(--font-mono);font-size:.72rem}
.td-due{width:100px}
.chip{display:inline-block;padding:.12rem .4rem;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.7rem;background:var(--color-surface-2);color:var(--color-text-secondary);border:0.5px solid var(--color-border)}
.chip-overdue{background:var(--color-coral-bg);color:var(--color-coral-text);border-color:rgba(216,90,48,.2)}
.chip-today{background:var(--color-accent-bg);color:var(--color-accent-text);border-color:rgba(186,117,23,.25)}
.chip-active{background:var(--color-accent-bg);color:var(--color-accent-text);border-color:rgba(186,117,23,.2)}
.td-act{width:56px;text-align:right;padding-right:.5rem}
.act-btns{display:flex;gap:.2rem;justify-content:flex-end}
.act-btn{background:transparent;border:0.5px solid var(--color-border);border-radius:var(--radius-sm);width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-tertiary);font-size:13px;transition:all .12s}
.act-btn:hover{background:var(--color-surface-2);border-color:var(--color-border-strong);color:var(--color-text-primary)}
.act-btn.del:hover{background:var(--color-danger-bg);border-color:rgba(226,75,74,.3);color:var(--color-danger)}
.rec-badge{display:inline-block;margin-left:.35rem;font-size:.58rem;font-weight:500;color:var(--color-accent-text);background:var(--color-accent-bg);padding:.08rem .3rem;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle;border:0.5px solid rgba(186,117,23,.2)}
.chkbox{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;cursor:pointer;border:1.5px solid var(--color-border-strong);background:transparent;font-size:10px;color:#fff}
.chkbox.checked{background:var(--color-accent-mid);border-color:var(--color-accent-mid)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--color-text-tertiary);animation:fadeUp .3s ease}
.no-api-banner{background:var(--color-accent-bg);border:0.5px solid rgba(186,117,23,.3);border-radius:var(--radius-md);padding:.75rem 1rem;margin-bottom:.875rem;font-size:.75rem;color:var(--color-accent-text);display:flex;align-items:flex-start;gap:.5rem}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .15s ease}
.modal-box{background:var(--color-surface);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:460px;border:0.5px solid var(--color-border-strong);animation:fadeUp .2s ease}
.modal-title{font-size:.9rem;font-weight:500;color:var(--color-text-primary);margin-bottom:1.25rem}
.form-grid{display:grid;gap:.75rem}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}
.flabel{display:block;color:var(--color-text-secondary);font-size:.7rem;font-weight:500;margin-bottom:.25rem}
.finput{width:100%;background:var(--color-surface-2);border:0.5px solid var(--color-border-strong);border-radius:var(--radius-md);color:var(--color-text-primary);padding:.45rem .65rem;font-size:.825rem;outline:none;transition:border-color .15s}
.finput:focus{border-color:var(--color-accent-mid);background:var(--color-surface)}
.form-actions{display:flex;gap:.5rem;margin-top:1.25rem;justify-content:flex-end}
.btn-cancel{background:transparent;border:0.5px solid var(--color-border-strong);color:var(--color-text-secondary);border-radius:var(--radius-md);padding:.4rem 1rem;font-size:.8rem;font-weight:400;cursor:pointer}
.btn-cancel:hover{background:var(--color-surface-2)}
.btn-save{background:var(--color-accent-mid);color:#fff;border-radius:var(--radius-md);padding:.4rem 1.1rem;font-size:.8rem;font-weight:500;cursor:pointer;border:none}
.btn-save:hover{opacity:.88}

@media(max-width:600px){
  .td-ent,.td-start{display:none}
  .sec-head-inner{grid-template-columns:32px 1fr 100px 56px}
  .col-hd.hide-sm{display:none}
  table{table-layout:auto}
}
</style>
</head>
<body>

<div id="week-strip">
  <div id="week-header">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-check" aria-hidden="true"></i></div>
      <span class="brand-name">TaskFlow</span>
    </div>
    <div class="wk-meta">
      <div class="wk-range" id="month-label"></div>
    </div>
  </div>
  <div id="week-grid"></div>
</div>

<div id="controls">
  <div id="ctrl-inner">
    <div style="display:flex;align-items:center;gap:.875rem;flex-wrap:wrap">
      <span class="today-str" id="today-str"></span>
      <div class="filter-btns">
        <button class="fbtn active" id="fbtn-due" onclick="setFilter('due')">Due today or prior</button>
        <button class="fbtn" id="fbtn-all" onclick="setFilter('all')">All tasks</button>
      </div>
      <div class="sync-row">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-lbl">Loading...</span>
      </div>
    </div>
    <button class="new-btn" id="new-task-btn">
      <i class="ti ti-plus" aria-hidden="true" style="font-size:14px"></i>
      New task
    </button>
  </div>
</div>

<div id="task-area"></div>

<div id="modal-bg" class="modal-bg" style="display:none">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">New task</div>
    <div class="form-grid">
      <div>
        <label class="flabel">Task name</label>
        <input class="finput" id="f-name" placeholder="Describe the task..."/>
      </div>
      <div>
        <label class="flabel">Entity / client</label>
        <input class="finput" id="f-entity" placeholder="Who is this for?"/>
      </div>
      <div class="form-row2">
        <div>
          <label class="flabel">Start date</label>
          <input class="finput" type="date" id="f-start"/>
        </div>
        <div>
          <label class="flabel">Due date</label>
          <input class="finput" type="date" id="f-due"/>
        </div>
      </div>
      <div>
        <label class="flabel">Recurrence</label>
        <select class="finput" id="f-rec">
          <option value="none">One-time</option>
          <option value="daily">Daily (business days)</option>
          <option value="weekly">Weekly</option>
          <option value="biweekly">Bi-weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-save" id="modal-save">Save task</button>
    </div>
  </div>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbwEXUjwa8iQVejUSoCIc1mA_kMVON2VRwZTKjE12Ezjn6MU6sJeUFmFckQ6n2Ky6iGT/exec";
var NO_API  = !API_URL || API_URL === "YOUR_APPS_SCRIPT_URL_HERE";

var tasks        = [];
var appointments = {};
var completions  = {};
var curFilter    = "due";
var editingId    = null;

function todayStr() { return new Date().toISOString().slice(0,10); }

function getWeekDays() {
  var now=new Date(), day=now.getDay(), diff=(day===0)?-6:1-day;
  var mon=new Date(now); mon.setDate(now.getDate()+diff);
  return Array.from({length:7},function(_,i){ var d=new Date(mon); d.setDate(mon.getDate()+i); return d.toISOString().slice(0,10); });
}

function addBizDays(dateStr, n) {
  var d=new Date(dateStr+"T12:00:00"), added=0;
  while(added<n){ d.setDate(d.getDate()+1); var dow=d.getDay(); if(dow!==0&&dow!==6) added++; }
  return d.toISOString().slice(0,10);
}

function nextOccurrence(task, fromDate) {
  if(task.recurrence==="daily")    return addBizDays(fromDate,1);
  var x=new Date(fromDate+"T12:00:00");
  if(task.recurrence==="weekly")   { x.setDate(x.getDate()+7); }
  else if(task.recurrence==="biweekly") { x.setDate(x.getDate()+14); }
  else if(task.recurrence==="monthly")  { x.setMonth(x.getMonth()+1); }
  return x.toISOString().slice(0,10);
}

function isOverdue(task)   { return task.dueDate < todayStr(); }
function isDueToday(task)  { return task.dueDate === todayStr(); }
function isCompleted(id)   { return !!completions[id+"|"+todayStr()]; }

function normalizeDate(val) {
  if(!val) return "";
  var s=String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){ var p=s.split("/"); return p[2]+"-"+p[0].padStart(2,"0")+"-"+p[1].padStart(2,"0"); }
  try{ var d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10); } catch(e){}
  return s;
}

function fmtDate(iso) {
  if(!iso) return "";
  var s=normalizeDate(iso), p=s.split("-");
  if(p.length!==3) return iso;
  return p[1]+"/"+p[2]+"/"+p[0];
}

function recLabel(r) { return {daily:"Daily",weekly:"Weekly",biweekly:"Bi-weekly",monthly:"Monthly",none:""}[r]||""; }

function sortTasks(arr) {
  return arr.slice().sort(function(a,b){
    if(a.dueDate<b.dueDate) return -1; if(a.dueDate>b.dueDate) return 1;
    return a.name.localeCompare(b.name);
  });
}

function makeUUID() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){ var r=Math.random()*16|0; return(c==="x"?r:(r&0x3|0x8)).toString(16); });
}

function setSync(state, msg) {
  var dot=document.getElementById("sync-dot"), lbl=document.getElementById("sync-lbl");
  if(!dot) return;
  dot.className="sync-dot"+(state==="syncing"?" syncing":state==="error"?" error":"");
  lbl.textContent=msg||(state==="syncing"?"Saving...":state==="error"?"Sync error":"Synced");
}

function apiGet() {
  if(NO_API) return Promise.resolve(null);
  return fetch(API_URL+"?t="+Date.now(),{redirect:"follow"}).then(function(r){return r.json();}).catch(function(){return null;});
}

function apiPost(body) {
  if(NO_API) return Promise.resolve(null);
  setSync("syncing");
  var url=API_URL+"?payload="+encodeURIComponent(JSON.stringify(body))+"&t="+Date.now();
  return fetch(url,{redirect:"follow"}).then(function(r){return r.json();}).then(function(j){setSync(j&&j.ok?"idle":"error");return j;}).catch(function(){setSync("error","Offline");return null;});
}

function localSave() {
  try{ localStorage.setItem("tf-tasks",JSON.stringify(tasks)); localStorage.setItem("tf-appts",JSON.stringify(appointments)); localStorage.setItem("tf-comps",JSON.stringify(completions)); }catch(e){}
}
function localLoad() {
  try{ tasks=JSON.parse(localStorage.getItem("tf-tasks")||"[]"); appointments=JSON.parse(localStorage.getItem("tf-appts")||"{}"); completions=JSON.parse(localStorage.getItem("tf-comps")||"{}"); }catch(e){}
}

function loadData() {
  localLoad(); renderAll(); setSync("syncing","Loading...");
  apiGet().then(function(data){
    if(!data||!data.ok){ setSync(NO_API?"idle":"error",NO_API?"Local only":"Offline"); return; }
    tasks=(data.tasks||[]).map(function(t){ t.startDate=normalizeDate(t.startDate); t.dueDate=normalizeDate(t.dueDate); return t; });
    var merged={};
    tasks.forEach(function(t){ (t.completedDates||[]).forEach(function(d){ merged[t.id+"|"+d]=true; }); });
    Object.keys(completions).forEach(function(k){ if(k.slice(-10)===todayStr()) merged[k]=true; });
    completions=merged; appointments=data.appts||{};
    localSave(); setSync("idle"); renderAll();
  });
}

function saveTaskForm() {
  var name=document.getElementById("f-name").value.trim();
  if(!name){ document.getElementById("f-name").focus(); return; }
  var task={
    id: editingId||makeUUID(), name: name,
    entity: document.getElementById("f-entity").value.trim(),
    startDate: normalizeDate(document.getElementById("f-start").value),
    dueDate:   normalizeDate(document.getElementById("f-due").value),
    recurrence: document.getElementById("f-rec").value,
    completedDates: editingId?((tasks.find(function(t){return t.id===editingId;})||{}).completedDates||[]):[]
  };
  var idx=tasks.findIndex(function(t){return t.id===task.id;});
  if(idx>=0) tasks[idx]=task; else tasks.push(task);
  closeModal(); localSave(); renderAll(); apiPost({action:"saveTask",task:task});
}

function deleteTask(id) {
  if(!confirm("Delete this task?")) return;
  tasks=tasks.filter(function(t){return t.id!==id;});
  Object.keys(completions).forEach(function(k){if(k.indexOf(id+"|")===0) delete completions[k];});
  localSave(); renderAll(); apiPost({action:"deleteTask",id:id});
}

function spawnNextOccurrence(task) {
  var nextStart=nextOccurrence(task,task.startDate);
  var nextDue=nextOccurrence(task,task.dueDate);
  var exists=tasks.some(function(tk){ return tk.name===task.name&&tk.entity===task.entity&&tk.recurrence===task.recurrence&&tk.dueDate===nextDue&&tk.id!==task.id; });
  if(!exists){
    var nt={id:makeUUID(),name:task.name,entity:task.entity,startDate:nextStart,dueDate:nextDue,recurrence:task.recurrence,completedDates:[]};
    tasks.push(nt); apiPost({action:"saveTask",task:nt});
  }
}

function toggleComplete(id) {
  var key=id+"|"+todayStr(), task=tasks.find(function(t){return t.id===id;}), wasDone=!!completions[key];
  if(wasDone){ delete completions[key]; }
  else{
    completions[key]=true;
    if(task&&task.recurrence!=="none") spawnNextOccurrence(task);
  }
  if(task){
    task.completedDates=Object.keys(completions).filter(function(k){return k.indexOf(id+"|")===0;}).map(function(k){return k.slice(id.length+1);});
    apiPost({action:"saveTask",task:task});
  }
  localSave(); renderAll();
}

function addAppt(date,text) {
  if(!text||!text.trim()) return;
  if(!appointments[date]) appointments[date]=[];
  appointments[date].push(text.trim());
  localSave(); renderWeek(); apiPost({action:"saveAppts",date:date,appts:appointments[date]});
}

function removeAppt(date,idx) {
  if(!appointments[date]) return;
  appointments[date].splice(idx,1);
  localSave(); renderWeek(); apiPost({action:"saveAppts",date:date,appts:appointments[date]});
}

function openModal(task) {
  editingId=task?task.id:null;
  document.getElementById("modal-title").textContent=task?"Edit task":"New task";
  document.getElementById("f-name").value=task?task.name:"";
  document.getElementById("f-entity").value=task?task.entity:"";
  document.getElementById("f-start").value=task?task.startDate:todayStr();
  document.getElementById("f-due").value=task?task.dueDate:todayStr();
  document.getElementById("f-rec").value=task?task.recurrence:"none";
  document.getElementById("modal-bg").style.display="flex";
  setTimeout(function(){document.getElementById("f-name").focus();},60);
}
function closeModal() { document.getElementById("modal-bg").style.display="none"; editingId=null; }

function setFilter(f) {
  curFilter=f;
  document.getElementById("fbtn-due").classList.toggle("active",f==="due");
  document.getElementById("fbtn-all").classList.toggle("active",f==="all");
  renderTasks();
}

function eh(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderWeek() {
  var days=getWeekDays(), t=todayStr(), dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var first=new Date(days[0]+"T12:00:00"), last=new Date(days[6]+"T12:00:00");
  var ml=(first.getMonth()===last.getMonth())
    ?first.toLocaleDateString("en-US",{month:"long",year:"numeric"})
    :first.toLocaleDateString("en-US",{month:"short"})+" – "+last.toLocaleDateString("en-US",{month:"short",year:"numeric"});
  document.getElementById("month-label").textContent=ml;

  var html="";
  for(var i=0;i<days.length;i++){
    var date=days[i], isToday=date===t, isPast=date<t;
    var appts=appointments[date]||[], dayNum=new Date(date+"T12:00:00").getDate();
    var cls="day-col"+(isToday?" is-today":(isPast?" is-past":""));
    var apptHtml="";
    if(appts.length===0){ apptHtml='<div class="appt-empty">—</div>'; }
    else { for(var ai=0;ai<appts.length;ai++){
      apptHtml+='<div class="appt-item"><div class="appt-dot"></div><span class="appt-txt">'+eh(appts[ai])+'</span>'
        +'<button class="appt-del" data-date="'+date+'" data-idx="'+ai+'"><i class="ti ti-x" aria-hidden="true"></i></button></div>';
    }}
    html+='<div class="'+cls+'">'
      +'<div class="day-hd"><div class="day-lbl">'+dayNames[i]+'</div><div class="day-num">'+dayNum+'</div></div>'
      +'<div class="appt-list">'+apptHtml+'</div>'
      +'<div class="appt-input-row">'
      +'<input class="appt-inp" id="ai-'+date+'" placeholder="+" data-date="'+date+'"/>'
      +'<button class="appt-add" id="ab-'+date+'" data-date="'+date+'" style="display:none"><i class="ti ti-plus" aria-hidden="true"></i></button>'
      +'</div></div>';
  }
  document.getElementById("week-grid").innerHTML=html;

  for(var i=0;i<days.length;i++){
    (function(date){
      var inp=document.getElementById("ai-"+date), btn=document.getElementById("ab-"+date);
      if(!inp||!btn) return;
      inp.addEventListener("input",function(){ btn.style.display=inp.value.trim()?"flex":"none"; });
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter"&&inp.value.trim()){ addAppt(date,inp.value); inp.value=""; btn.style.display="none"; } });
      btn.addEventListener("click",function(){ if(inp.value.trim()){ addAppt(date,inp.value); inp.value=""; btn.style.display="none"; } });
    })(days[i]);
  }
  document.getElementById("week-grid").addEventListener("click",function(e){
    var del=e.target.closest(".appt-del");
    if(del) removeAppt(del.getAttribute("data-date"),parseInt(del.getAttribute("data-idx"),10));
  });
}

function renderTasks() {
  var t=todayStr(), sorted=sortTasks(tasks);
  var showList=(curFilter==="due")
    ?sorted.filter(function(task){ return task.dueDate<=t||task.startDate<=t; })
    :sorted;
  var pending=showList.filter(function(task){return !isCompleted(task.id);});
  var done=showList.filter(function(task){return isCompleted(task.id);});
  var combined=pending.concat(done);
  var area=document.getElementById("task-area");

  if(!combined.length){
    area.innerHTML='<div class="empty-state"><i class="ti ti-checkbox" style="font-size:2rem;display:block;margin-bottom:.5rem;opacity:.3" aria-hidden="true"></i><div style="font-size:.875rem;font-weight:500;margin-bottom:.25rem">No tasks to show</div><div style="font-size:.8rem">Click "New task" to get started</div></div>';
    return;
  }

  var banner=NO_API?'<div class="no-api-banner"><i class="ti ti-alert-triangle" style="font-size:15px;flex-shrink:0;margin-top:1px" aria-hidden="true"></i><span>Google Sheets not connected — data is saved locally on this device only.</span></div>':"";

  var rows="";
  for(var i=0;i<combined.length;i++){
    var task=combined[i];
    var done2=isCompleted(task.id);
    var overdue=!done2&&task.dueDate<t;
    var dueToday2=!done2&&task.dueDate===t;
    var active=!done2&&!overdue&&!dueToday2&&task.startDate<=t;
    var rowCls=done2?"row-done":"";
    var chipCls=overdue?"chip chip-overdue":dueToday2?"chip chip-today":active?"chip chip-active":"chip";
    var badge=(task.recurrence!=="none"&&!done2)?'<span class="rec-badge">'+recLabel(task.recurrence)+'</span>':"";
    rows+='<tr class="'+rowCls+'">'
      +'<td class="td-chk"><button class="chkbox'+(done2?" checked":"")+'" data-id="'+task.id+'">'+(done2?'<i class="ti ti-check" aria-hidden="true"></i>':'')+'</button></td>'
      +'<td class="td-name">'+eh(task.name)+badge+'</td>'
      +'<td class="td-ent">'+eh(task.entity||"")+'</td>'
      +'<td class="td-start">'+fmtDate(task.startDate)+'</td>'
      +'<td class="td-due"><span class="'+chipCls+'">'+fmtDate(task.dueDate)+'</span></td>'
      +'<td class="td-act"><div class="act-btns">'
      +'<button class="act-btn edit-btn" data-id="'+task.id+'" title="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>'
      +'<button class="act-btn del" data-id="'+task.id+'" title="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button>'
      +'</div></td></tr>';
  }

  var tableHtml='<div class="section">'
    +'<div class="sec-head"><div class="sec-head-inner">'
    +'<div class="col-hd"></div>'
    +'<div class="col-hd">Task</div>'
    +'<div class="col-hd hide-sm">Entity</div>'
    +'<div class="col-hd hide-sm">Start</div>'
    +'<div class="col-hd">Due</div>'
    +'<div class="col-hd"></div>'
    +'</div></div>'
    +'<table><tbody>'+rows+'</tbody></table></div>';

  area.innerHTML=banner+tableHtml;
}

function renderAll() { renderWeek(); renderTasks(); }

document.getElementById("task-area").addEventListener("click",function(e){
  var chk=e.target.closest(".chkbox"); if(chk){toggleComplete(chk.getAttribute("data-id"));return;}
  var edit=e.target.closest(".edit-btn"); if(edit){var id=edit.getAttribute("data-id"); var task=tasks.find(function(t){return t.id===id;}); if(task) openModal(task); return;}
  var del=e.target.closest(".del"); if(del){deleteTask(del.getAttribute("data-id"));return;}
});
document.getElementById("new-task-btn").addEventListener("click",function(){openModal(null);});
document.getElementById("modal-cancel").addEventListener("click",closeModal);
document.getElementById("modal-save").addEventListener("click",saveTaskForm);
document.getElementById("modal-bg").addEventListener("click",function(e){if(e.target===this)closeModal();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});

document.getElementById("today-str").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});

loadData();
</script>
</body>
</html>
